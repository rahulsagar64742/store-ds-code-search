
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store & DS Code Search Tool</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #586579;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    .message {
      padding: 14px;
      border-radius: 8px;
      background: #eef4ff;
      line-height: 1.7;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Store & DS Code Search</h1>
    <p>Search using Store Name, DS Code or DS ID</p>

    <input
      id="searchInput"
      type="search"
      placeholder="Enter Store Name, DS Code or DS ID"
      autocomplete="off"
    >

    <button id="searchButton" type="button">Search</button>

    <div id="result" aria-live="polite"></div>
  </main>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const result = document.getElementById("result");

    function searchStore() {
      const query = searchInput.value.trim();

      if (!query) {
        result.textContent = "Please enter a Store Name, DS Code or DS ID.";
        return;
      }

      result.textContent =
        "Firebase connection is not added yet. We will connect your store master data in the next steps.";
    }

    searchButton.addEventListener("click", searchStore);

    searchInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchStore();
      }
    });
  </script>
</body>
</html>
