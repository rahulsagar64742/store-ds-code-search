<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store & DS Code Search</title>

  <style>
    :root {
      color-scheme: light;
      --brand: #1769e0;
      --brand-dark: #0d4fb5;
      --ink: #172033;
      --muted: #5d6b82;
      --line: #dce5f2;
      --surface: #ffffff;
      --soft: #f4f7fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eaf2ff 0, #f5f7fb 240px, #f5f7fb 100%);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 16px auto;
      padding: 24px;
      background: var(--surface);
      border: 1px solid rgba(210, 222, 240, .9);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(30, 60, 100, .08);
    }

    h2 {
      margin: 2px 0 10px;
      text-align: center;
      font-size: clamp(23px, 5vw, 30px);
      line-height: 1.2;
      letter-spacing: -.4px;
    }

    main > p:not(.status) {
      margin: 0 0 18px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    input, button {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 12px 14px;
      margin: 8px 0;
      font: inherit;
      font-size: 16px;
      border-radius: 10px;
    }

    input {
      color: var(--ink);
      background: #fff;
      border: 1px solid #cbd6e6;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input::placeholder { color: #8995a8; }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, .13);
    }

    input:disabled, button:disabled {
      opacity: .58;
      cursor: not-allowed;
    }

    button {
      background: var(--brand);
      color: #fff;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(23, 105, 224, .12);
      transition: background .15s, transform .05s, box-shadow .15s;
      touch-action: manipulation;
    }

    button:hover:not(:disabled) {
      background: var(--brand-dark);
      box-shadow: 0 4px 10px rgba(23, 105, 224, .18);
    }

    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #9fc4ff; outline-offset: 2px; }

    hr {
      margin: 24px 0;
      border: 0;
      border-top: 1px solid #e4eaf3;
    }

    .status {
      color: var(--muted);
      overflow-wrap: anywhere;
      line-height: 1.45;
      font-size: 14px;
    }

    #status {
      padding: 10px 12px;
      border-radius: 9px;
      background: #f7f9fd;
    }

    .result {
      background: #fff;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-top: 14px;
      overflow-wrap: anywhere;
      box-shadow: 0 4px 12px rgba(30, 60, 100, .045);
    }

    .result-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .field {
      min-width: 0;
      padding: 12px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
      word-break: break-word;
      background: #fff;
      font-size: 14px;
      line-height: 1.4;
    }

    .field strong {
      display: block;
      margin-bottom: 5px;
      color: #53627a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2px;
      text-transform: uppercase;
    }

    .barcode-area {
      margin-top: 14px;
      padding: 14px 10px;
      text-align: center;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .barcode-area p {
      margin: 0 0 8px;
      font-weight: 700;
      color: var(--ink);
    }

    .qr-code {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
      padding: 8px;
      overflow: hidden;
    }

    .qr-code img, .qr-code canvas {
      max-width: 100%;
      height: auto;
    }

    #admin {
      background: #f8faff;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    #adminToggle, #updateMasterToggle { background: #34445f; }
    #adminToggle:hover:not(:disabled), #updateMasterToggle:hover:not(:disabled) { background: #24344d; }

    label[for="csvFile"] {
      display: block;
      margin: 12px 0 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      body { padding: 8px; }
      main {
        margin: 6px auto;
        padding: 16px 12px;
        border-radius: 14px;
      }
      h2 { font-size: 24px; }
      main > p:not(.status) { font-size: 14px; }
      input, button { min-height: 48px; padding: 12px; border-radius: 9px; }
      .result { padding: 9px; border-radius: 11px; }
      .field { padding: 10px 8px; font-size: 13px; }
      .field strong { font-size: 11px; }
      #admin { padding: 10px; }
      .qr-code { min-height: 140px; }
    }

    @media (max-width: 340px) {
      .result-grid { grid-template-columns: minmax(0, 1fr); }
      .field { font-size: 14px; }
    }
  </style>
</head>

<body>
<main>
  <h2>Store & DS Code Search</h2>
  <p>Search by Store Name, DS Code or DS ID</p>

  <input id="searchInput"
         placeholder="Enter Store Name, DS Code or DS ID">

  <button id="searchButton">Search</button>

  <p id="status" class="status">Connecting to database...</p>
  <div id="results"></div>

  <hr>

  
<section id="admin">
  <button type="button" id="adminToggle">Admin Login</button>

  <div id="adminPanel" hidden>
    <input id="adminEmail" type="email" placeholder="Admin email" autocomplete="username">
    <input id="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password">

    <button type="button" id="loginButton">Login</button>
    <p id="adminStatus" class="status">Not logged in</p>

    <div id="adminControls" hidden>
      <button type="button" id="logoutButton">Logout</button>

      <hr>

      <button type="button" id="updateMasterToggle">Update Master Data</button>

      <div id="uploadPanel" hidden>
        <label for="csvFile">Choose store_master.csv</label>
        <input id="csvFile" type="file" accept=".csv,text/csv" disabled>

        <button type="button" id="uploadButton" disabled>Upload Master Data</button>
        <p id="uploadStatus" class="status"></p>
      </div>
    </div>
  </div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="public/firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const searchInput = document.getElementById("searchInput");
  const adminStatus = document.getElementById("adminStatus");
  const uploadStatus = document.getElementById("uploadStatus");
  const csvFile = document.getElementById("csvFile");
  const uploadButton = document.getElementById("uploadButton");

  let stores = [];
  let db;
  let auth;

  function normalizeHeader(value) {
    return String(value || "").trim().toLowerCase()
      .replace(/[\s_-]+/g, "");
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;
    text = text.replace(/^\uFEFF/, "");

    for (let i = 0; i < text.length; i++) {
      const c = text[i];

      if (c === '"') {
        if (quoted && text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          quoted = !quoted;
        }
      } else if (c === "," && !quoted) {
        row.push(field);
        field = "";
      } else if ((c === "\n" || c === "\r") && !quoted) {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field);
        if (row.some(v => v.trim() !== "")) rows.push(row);
        row = [];
        field = "";
      } else {
        field += c;
      }
    }

    row.push(field);
    if (row.some(v => v.trim() !== "")) rows.push(row);
    return rows;
  }

  function mapHeader(headers, aliases) {
    return headers.findIndex(h => aliases.includes(normalizeHeader(h)));
  }

  function mapRecord(headers, row) {
    const value = aliases => {
      const i = mapHeader(headers, aliases);
      return i < 0 ? "" : String(row[i] ?? "").trim();
    };

    return {
      ds_id: value(["dsid", "storeid"]),
      store_name: value(["storename", "dsname"]),
      ds_Code: value(["dscode", "storecode"]),
      bay: value(["bay"]),
      picking_shift: value(["pickingshift", "shift"]),
      new_xd_remark: value(["newxdremarks"]),
      pallet_id: value(["palletid"])
    };
  }

  function validateCSVRows(rows) {
    if (rows.length < 2) {
      throw new Error("CSV has no data rows. Please select a CSV with a header row and at least one record.");
    }

    const headers = rows[0];
    const requiredColumns = [
      { label: "DS ID", aliases: ["dsid", "storeid"] },
      { label: "Store Name", aliases: ["storename", "dsname"] },
      { label: "DS Code", aliases: ["dscode", "storecode"] },
      { label: "Bay", aliases: ["bay"] },
      { label: "Picking Shift", aliases: ["pickingshift", "shift"] },
      { label: "new_xd_remarks", aliases: ["newxdremarks"] },
      { label: "Pallet ID", aliases: ["palletid"] }
    ];

    const missingColumns = requiredColumns
      .filter(column => mapHeader(headers, column.aliases) < 0)
      .map(column => column.label);

    if (missingColumns.length) {
      throw new Error(
        "Missing required CSV column(s): " + missingColumns.join(", ") +
        ". Please use the standard store_master.csv headers."
      );
    }

    const records = rows.slice(1)
      .map(row => mapRecord(headers, row))
      .filter(record =>
        record.ds_id || record.ds_Code || record.store_name ||
        record.bay || record.picking_shift || record.new_xd_remark ||
        record.pallet_id
      );

    if (!records.length) {
      throw new Error("No records found. Please check your CSV data.");
    }

    const missingIds = records
      .map((record, index) => record.ds_id ? null : index + 2)
      .filter(lineNumber => lineNumber !== null);

    if (missingIds.length) {
      const shownLines = missingIds.slice(0, 10).join(", ");
      const more = missingIds.length > 10
        ? " (and " + (missingIds.length - 10) + " more)"
        : "";
      throw new Error(
        "DS ID is blank on CSV row(s): " + shownLines + more +
        ". Please fill in every DS ID before uploading."
      );
    }

    return records;
  }

  async function getCsvManagedDocs() {
    const snapshot = await db.collection("store_master").get();
    return snapshot.docs.filter(doc => /^csv_\d+$/.test(doc.id));
  }

  async function loadStores() {
    try {
      const snapshot = await db.collection("store_master").get();
      stores = snapshot.docs.map(doc => doc.data());
      statusBox.textContent =
        "Database connected. Records loaded: " + stores.length;
    } catch (e) {
      statusBox.textContent = "Database error: " + e.message;
    }
  }

  function addField(container, label, value) {
    const field = document.createElement("div");
    field.className = "field";

    const heading = document.createElement("strong");
    heading.textContent = label + ":";

    const content = document.createElement("span");
    content.textContent = String(value || "");

    field.append(heading, content);
    container.appendChild(field);
  }

  function searchStore() {
    const query = searchInput.value.trim().toLowerCase();
    resultsBox.replaceChildren();

    if (!query) {
      statusBox.textContent = "Please enter a search value.";
      return;
    }

    const matches = stores.filter(store =>
      [store.store_name, store.ds_Code, store.ds_id]
        .some(value =>
          String(value || "").toLowerCase().includes(query)
        )
    );

    if (!matches.length) {
      statusBox.textContent = "No matching record found.";
      return;
    }

    statusBox.textContent = "Matching records: " + matches.length;

    matches.forEach((store, index) => {
      const card = document.createElement("div");
      card.className = "result";

      const grid = document.createElement("div");
      grid.className = "result-grid";

      addField(grid, "DS Code", store.ds_Code);
      addField(grid, "DS ID", store.ds_id);
      addField(grid, "Store Name", store.store_name);
      addField(grid, "Bay", store.bay);
      addField(grid, "Picking Shift", store.picking_shift);
      addField(grid, "Pallet ID", store.pallet_id);
      addField(
        grid,
        "new_xd_remarks",
        store.new_xd_remark || store.new_xd_remarks
      );

      card.appendChild(grid);

      if (store.pallet_id) {
        const barcodeArea = document.createElement("div");
        barcodeArea.className = "barcode-area";

        const title = document.createElement("p");
        title.textContent = "Pallet ID 2D Barcode";

        const qr = document.createElement("div");
        qr.className = "qr-code";
        qr.id = "qr-" + index;

        barcodeArea.append(title, qr);
        card.appendChild(barcodeArea);

        new QRCode(qr, {
          text: String(store.pallet_id),
          width: 160,
          height: 160
        });
      }

      resultsBox.appendChild(card);
    });
  }

  document.getElementById("searchButton")
    .addEventListener("click", searchStore);

  searchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") searchStore();
  });

  
function setAdminUI(user) {
  const isLoggedIn = !!user;

  adminStatus.textContent = isLoggedIn
    ? "Logged in as " + user.email
    : "Not logged in";

  document.getElementById("loginButton").hidden = isLoggedIn;
  document.getElementById("logoutButton").hidden = !isLoggedIn;
  document.getElementById("adminEmail").hidden = isLoggedIn;
  document.getElementById("adminPassword").hidden = isLoggedIn;

  document.getElementById("adminControls").hidden = !isLoggedIn;

  // Always close the upload panel when the login state changes.
  document.getElementById("uploadPanel").hidden = true;

  csvFile.disabled = !isLoggedIn;
  uploadButton.disabled = !isLoggedIn;

  document.getElementById("adminToggle").textContent = isLoggedIn
    ? "Admin — Master Data Upload"
    : "Admin Login";

  document.getElementById("updateMasterToggle").textContent = "Update Master Data";
}

const adminToggle = document.getElementById("adminToggle");
const adminPanel = document.getElementById("adminPanel");
const updateMasterToggle = document.getElementById("updateMasterToggle");
const uploadPanel = document.getElementById("uploadPanel");

adminToggle.addEventListener("click", function () {
  adminPanel.hidden = !adminPanel.hidden;
});

updateMasterToggle.addEventListener("click", function () {
  uploadPanel.hidden = !uploadPanel.hidden;
});
  document.getElementById("loginButton")
    .addEventListener("click", async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      adminStatus.textContent = "Signing in...";

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (e) {
        adminStatus.textContent = "Login failed: " + e.message;
      }
    });

  document.getElementById("logoutButton")
    .addEventListener("click", () => auth.signOut());

  csvFile.addEventListener("change", () => {
    uploadStatus.textContent = csvFile.files.length
      ? "Selected: " + csvFile.files[0].name
      : "";
  });

  uploadButton.addEventListener("click", async () => {
    const user = auth.currentUser;
    const file = csvFile.files[0];

    if (!user) {
      uploadStatus.textContent = "Please log in as admin first.";
      return;
    }

    if (!file) {
      uploadStatus.textContent = "Please select the CSV file first.";
      return;
    }

    uploadButton.disabled = true;
    csvFile.disabled = true;
    uploadStatus.textContent = "Checking CSV file...";

    try {
      const rows = parseCSV(await file.text());
      const records = validateCSVRows(rows);
      const existingCsvDocs = await getCsvManagedDocs();
      const staleDocs = existingCsvDocs.filter(doc => {
        const index = Number(doc.id.slice(4));
        return Number.isInteger(index) && index >= records.length;
      });

      const confirmed = confirm(
        "CSV validation passed.\\n\\n" +
        "Records to upload: " + records.length + "\\n" +
        "Existing CSV-managed records: " + existingCsvDocs.length + "\\n" +
        "Old extra CSV records to remove: " + staleDocs.length + "\\n\\n" +
        "Continue? Existing csv_N records will be replaced with this CSV. " +
        "Extra csv_N records will be removed. Other documents are untouched. " +
        "Duplicate DS IDs are allowed and will remain separate rows. " +
        "Keep the same CSV row order for future updates."
      );

      if (!confirmed) {
        uploadStatus.textContent = "Upload cancelled. No data was changed.";
        return;
      }

      for (let start = 0; start < records.length; start += 400) {
        const batch = db.batch();

        records.slice(start, start + 400).forEach((record, index) => {
          const ref = db.collection("store_master")
            .doc("csv_" + (start + index));
          batch.set(ref, record);
        });

        await batch.commit();
        uploadStatus.textContent =
          "Uploading records: " +
          Math.min(start + 400, records.length) + " of " + records.length + "...";
      }

      for (let start = 0; start < staleDocs.length; start += 400) {
        const batch = db.batch();
        staleDocs.slice(start, start + 400).forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        uploadStatus.textContent = "Removing old extra CSV records...";
      }

      uploadStatus.textContent = "Verifying uploaded records...";
      const verifiedDocs = await getCsvManagedDocs();

      if (verifiedDocs.length !== records.length) {
        throw new Error(
          "Verification mismatch: CSV has " + records.length +
          " records, but Firebase has " + verifiedDocs.length +
          " CSV-managed records. Please check the data before uploading again."
        );
      }

      await loadStores();

      uploadStatus.textContent =
        "Success! " + verifiedDocs.length +
        " records uploaded and verified. Duplicate DS IDs were preserved.";

      csvFile.value = "";
    } catch (e) {
      uploadStatus.textContent = "Upload failed: " + e.message;
    } finally {
      csvFile.disabled = !auth.currentUser;
      uploadButton.disabled = !auth.currentUser;
    }
  });

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    auth.onAuthStateChanged(setAdminUI);
    loadStores();
  } catch (e) {
    statusBox.textContent = "Firebase setup error: " + e.message;
  }
</script>
</body>
</html>
