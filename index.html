<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store & DS Code Search</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      color: #172033;
    }

    main {
      max-width: 680px;
      margin: 16px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }

    h2 { text-align: center; }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
      border-radius: 7px;
    }

    input { border: 1px solid #bbb; }

    button {
      background: #1769e0;
      color: white;
      border: 0;
      cursor: pointer;
    }

    hr {
      margin: 24px 0;
      border: 0;
      border-top: 1px solid #ddd;
    }

    .result {
      background: #f5f8ff;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-top: 1px solid #d8e0ee;
      border-left: 1px solid #d8e0ee;
    }

    .field {
      padding: 12px 9px;
      border-right: 1px solid #d8e0ee;
      border-bottom: 1px solid #d8e0ee;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .field strong {
      display: block;
      margin-bottom: 5px;
      color: #172033;
    }

    .barcode-area {
      margin-top: 18px;
      padding: 12px;
      text-align: center;
      background: white;
      border: 1px solid #d8e0ee;
      border-radius: 8px;
    }

    .barcode-area p {
      font-weight: bold;
      margin-top: 0;
    }

    .qr-code {
      display: flex;
      justify-content: center;
      padding: 8px;
    }

    .status {
      color: #555;
      overflow-wrap: anywhere;
    }

    #admin {
      background: #fafafa;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 420px) {
      main { padding: 12px; }
      .field { padding: 10px 7px; font-size: 14px; }
    }
  </style>
</head>

<body>
<main>
  <h2>Store & DS Code Search</h2>
  <p>Search by Store Name, DS Code or DS ID</p>

  <input id="searchInput"
         placeholder="Enter Store Name, DS Code or DS ID">

  <button id="searchButton">Search</button>

  <p id="status" class="status">Connecting to database...</p>
  <div id="results"></div>

  <hr>

  
<section id="admin">
  <button type="button" id="adminToggle">Admin Login</button>

  <div id="adminPanel" hidden>
    <input id="adminEmail" type="email" placeholder="Admin email" autocomplete="username">
    <input id="adminPassword" type="password" placeholder="Admin password" autocomplete="current-password">

    <button type="button" id="loginButton">Login</button>
    <p id="adminStatus" class="status">Not logged in</p>

    <div id="adminControls" hidden>
      <button type="button" id="logoutButton">Logout</button>

      <hr>

      <button type="button" id="updateMasterToggle">Update Master Data</button>

      <div id="uploadPanel" hidden>
        <label for="csvFile">Choose store_master.csv</label>
        <input id="csvFile" type="file" accept=".csv,text/csv" disabled>

        <button type="button" id="uploadButton" disabled>Upload Master Data</button>
        <p id="uploadStatus" class="status"></p>
      </div>
    </div>
  </div>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="public/firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  const statusBox = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const searchInput = document.getElementById("searchInput");
  const adminStatus = document.getElementById("adminStatus");
  const uploadStatus = document.getElementById("uploadStatus");
  const csvFile = document.getElementById("csvFile");
  const uploadButton = document.getElementById("uploadButton");

  let stores = [];
  let db;
  let auth;

  function normalizeHeader(value) {
    return String(value || "").trim().toLowerCase()
      .replace(/[\s_-]+/g, "");
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;
    text = text.replace(/^\uFEFF/, "");

    for (let i = 0; i < text.length; i++) {
      const c = text[i];

      if (c === '"') {
        if (quoted && text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          quoted = !quoted;
        }
      } else if (c === "," && !quoted) {
        row.push(field);
        field = "";
      } else if ((c === "\n" || c === "\r") && !quoted) {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field);
        if (row.some(v => v.trim() !== "")) rows.push(row);
        row = [];
        field = "";
      } else {
        field += c;
      }
    }

    row.push(field);
    if (row.some(v => v.trim() !== "")) rows.push(row);
    return rows;
  }

  function mapHeader(headers, aliases) {
    return headers.findIndex(h => aliases.includes(normalizeHeader(h)));
  }

  function mapRecord(headers, row) {
    const value = aliases => {
      const i = mapHeader(headers, aliases);
      return i < 0 ? "" : String(row[i] ?? "").trim();
    };

    return {
      ds_id: value(["dsid", "storeid"]),
      store_name: value(["storename", "dsname"]),
      ds_Code: value(["dscode", "storecode"]),
      bay: value(["bay"]),
      picking_shift: value(["pickingshift", "shift"]),
      new_xd_remark: value(["newxdremarks"]),
      pallet_id: value(["palletid"])
    };
  }

  async function loadStores() {
    try {
      const snapshot = await db.collection("store_master").get();
      stores = snapshot.docs.map(doc => doc.data());
      statusBox.textContent =
        "Database connected. Records loaded: " + stores.length;
    } catch (e) {
      statusBox.textContent = "Database error: " + e.message;
    }
  }

  function addField(container, label, value) {
    const field = document.createElement("div");
    field.className = "field";

    const heading = document.createElement("strong");
    heading.textContent = label + ":";

    const content = document.createElement("span");
    content.textContent = String(value || "");

    field.append(heading, content);
    container.appendChild(field);
  }

  function searchStore() {
    const query = searchInput.value.trim().toLowerCase();
    resultsBox.replaceChildren();

    if (!query) {
      statusBox.textContent = "Please enter a search value.";
      return;
    }

    const matches = stores.filter(store =>
      [store.store_name, store.ds_Code, store.ds_id]
        .some(value =>
          String(value || "").toLowerCase().includes(query)
        )
    );

    if (!matches.length) {
      statusBox.textContent = "No matching record found.";
      return;
    }

    statusBox.textContent = "Matching records: " + matches.length;

    matches.forEach((store, index) => {
      const card = document.createElement("div");
      card.className = "result";

      const grid = document.createElement("div");
      grid.className = "result-grid";

      addField(grid, "DS Code", store.ds_Code);
      addField(grid, "DS ID", store.ds_id);
      addField(grid, "Store Name", store.store_name);
      addField(grid, "Bay", store.bay);
      addField(grid, "Picking Shift", store.picking_shift);
      addField(grid, "Pallet ID", store.pallet_id);
      addField(
        grid,
        "new_xd_remarks",
        store.new_xd_remark || store.new_xd_remarks
      );

      card.appendChild(grid);

      if (store.pallet_id) {
        const barcodeArea = document.createElement("div");
        barcodeArea.className = "barcode-area";

        const title = document.createElement("p");
        title.textContent = "Pallet ID 2D Barcode";

        const qr = document.createElement("div");
        qr.className = "qr-code";
        qr.id = "qr-" + index;

        barcodeArea.append(title, qr);
        card.appendChild(barcodeArea);

        new QRCode(qr, {
          text: String(store.pallet_id),
          width: 160,
          height: 160
        });
      }

      resultsBox.appendChild(card);
    });
  }

  document.getElementById("searchButton")
    .addEventListener("click", searchStore);

  searchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") searchStore();
  });

  
function setAdminUI(user) {
  const isLoggedIn = !!user;

  adminStatus.textContent = isLoggedIn
    ? "Logged in as " + user.email
    : "Not logged in";

  document.getElementById("loginButton").hidden = isLoggedIn;
  document.getElementById("logoutButton").hidden = !isLoggedIn;
  document.getElementById("adminEmail").hidden = isLoggedIn;
  document.getElementById("adminPassword").hidden = isLoggedIn;

  document.getElementById("adminControls").hidden = !isLoggedIn;

  // Always close the upload panel when the login state changes.
  document.getElementById("uploadPanel").hidden = true;

  csvFile.disabled = !isLoggedIn;
  uploadButton.disabled = !isLoggedIn;

  document.getElementById("adminToggle").textContent = isLoggedIn
    ? "Admin — Master Data Upload"
    : "Admin Login";

  document.getElementById("updateMasterToggle").textContent = "Update Master Data";
}

const adminToggle = document.getElementById("adminToggle");
const adminPanel = document.getElementById("adminPanel");
const updateMasterToggle = document.getElementById("updateMasterToggle");
const uploadPanel = document.getElementById("uploadPanel");

adminToggle.addEventListener("click", function () {
  adminPanel.hidden = !adminPanel.hidden;
});

updateMasterToggle.addEventListener("click", function () {
  uploadPanel.hidden = !uploadPanel.hidden;
});
  document.getElementById("loginButton")
    .addEventListener("click", async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      adminStatus.textContent = "Signing in...";

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (e) {
        adminStatus.textContent = "Login failed: " + e.message;
      }
    });

  document.getElementById("logoutButton")
    .addEventListener("click", () => auth.signOut());

  csvFile.addEventListener("change", () => {
    uploadStatus.textContent = csvFile.files.length
      ? "Selected: " + csvFile.files[0].name
      : "";
  });

  uploadButton.addEventListener("click", async () => {
    const user = auth.currentUser;
    const file = csvFile.files[0];

    if (!user) {
      uploadStatus.textContent = "Please log in as admin first.";
      return;
    }

    if (!file) {
      uploadStatus.textContent = "Please select the CSV file first.";
      return;
    }

    uploadButton.disabled = true;
    uploadStatus.textContent = "Reading CSV...";

    try {
      const rows = parseCSV(await file.text());

      if (rows.length < 2) {
        throw new Error("CSV has no data rows.");
      }

      const headers = rows[0];

      const records = rows.slice(1)
        .map(row => mapRecord(headers, row))
        .filter(r => r.ds_id || r.ds_Code || r.store_name);

      if (!records.length) {
        throw new Error("No records found. Please check your CSV column headings.");
      }

      if (records.some(r => !r.ds_id)) {
        throw new Error("A record has no DS ID. Add a DS ID to every row before uploading.");
      }

      const confirmed = confirm(
        "Upload " + records.length +
        " records to Firebase? Rows will be stored separately. Keep the same CSV row order for future updates."
      );

      if (!confirmed) {
        uploadStatus.textContent = "Upload cancelled.";
        return;
      }

      for (let start = 0; start < records.length; start += 400) {
        const batch = db.batch();

        records.slice(start, start + 400).forEach((record, index) => {
          const ref = db.collection("store_master")
            .doc("csv_" + (start + index));

          batch.set(ref, record);
        });

        await batch.commit();

        uploadStatus.textContent =
          "Uploaded " + Math.min(start + 400, records.length) +
          " of " + records.length + " records...";
      }

      await loadStores();

      uploadStatus.textContent =
        "Upload complete: " + records.length + " records processed.";

      csvFile.value = "";
    } catch (e) {
      uploadStatus.textContent = "Upload failed: " + e.message;
    } finally {
      uploadButton.disabled = !auth.currentUser;
    }
  });

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    auth.onAuthStateChanged(setAdminUI);
    loadStores();
  } catch (e) {
    statusBox.textContent = "Firebase setup error: " + e.message;
  }
</script>
</body>
</html>
